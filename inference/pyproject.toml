[project]
name = "removeit-inference"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.117,<1",
  "uvicorn[standard]>=0.35,<1",
  "pillow>=11.3,<13",
  "numpy>=1.26.4,<3",
  "opencv-python>=4.11,<5",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.11,<3"
]

[project.optional-dependencies]
ml = [
  "simple-lama-inpainting-updated>=0.1.3,<1"
]
test = ["pytest>=8.4,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using .* with .* is deprecated:Warning",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"
]
