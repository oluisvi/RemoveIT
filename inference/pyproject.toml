[project]
name = "removeit-inference"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.117,<1",
  "uvicorn[standard]>=0.35,<1",
  "pillow>=11.3,<13",
  "numpy>=1.24.3,<2",
  "opencv-python-headless>=4.10,<4.12",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.11,<3"
]

[project.optional-dependencies]
ml = [
  "torch>=2.7,<3",
  "transformers>=4.56,<6",
  "simple-lama-inpainting>=0.1.2,<1"
]
test = ["pytest>=8.4,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using .* with .* is deprecated:Warning",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"
]
